name: Repair frontend lockfile (temporary)
on:
  push:
    paths:
      - .github/workflows/repair-build.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --save-dev 'laravel-vite-plugin@^1.3.0' --no-audit --no-fund
      - run: npm run build
      - name: Commit manifest dependency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: include Laravel Vite integration and lockfile'
          git push origin HEAD:master
