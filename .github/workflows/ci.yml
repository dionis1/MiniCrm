name: MiniCRM development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xml, sqlite3, pdo_sqlite, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan test
      - run: vendor/bin/pint --test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xml, sqlite3, pdo_sqlite, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - name: Prepare disposable SQLite app
        run: |
          cp .env.example .env
          printf '\nAPP_URL=http://127.0.0.1:8010\nDB_DATABASE=%s/database/browser.sqlite\nSANCTUM_STATEFUL_DOMAINS=127.0.0.1:8010,localhost:8010\n' "$PWD" >> .env
          php artisan key:generate
          touch database/browser.sqlite
          php artisan migrate --force
      - run: npx playwright install --with-deps chromium
      - name: Start Laravel development server
        run: |
          php artisan serve --host=127.0.0.1 --port=8010 > /tmp/minicrm-browser.log 2>&1 &
          sleep 3
      - run: npm run test:browser
      - name: Output server log on failure
        if: failure()
        run: cat /tmp/minicrm-browser.log || true
