name: Resolve modern dependency lockfiles (one-time)
on:
  push:
    paths:
      - .github/workflows/resolve-locks.yml
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xml, sqlite3, pdo_sqlite, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve stable PHP dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Resolve frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock package-lock.json
          git commit -m 'build: lock Laravel 13 and Vue 3 dependencies'
          git push origin HEAD:master
